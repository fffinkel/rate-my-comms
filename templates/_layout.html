{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.}}</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input[type=text], select, textarea { width: 100%; box-sizing: border-box; padding: .5rem; font: inherit; margin-top: .25rem; }
  textarea { min-height: 6rem; }
  button { font: inherit; padding: .5rem 1rem; margin-top: 1rem; cursor: pointer; }
  pre { padding: .75rem; background: rgba(127,127,127,.15); overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  .snippet { margin-top: 1.5rem; }
  .snippet header { display: flex; justify-content: space-between; align-items: baseline; }
  .snippet button { margin: 0; padding: .25rem .75rem; }
  .muted { opacity: .7; }
  .err { color: #c00; }
  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid rgba(127,127,127,.3); }
  blockquote { margin: .5rem 0 1rem; padding-left: 1rem; border-left: 3px solid rgba(127,127,127,.4); }
</style>
</head>
<body>{{end}}
{{define "foot"}}</body></html>{{end}}
